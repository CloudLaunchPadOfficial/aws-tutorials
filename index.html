<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud LaunchPad - AWS EC2</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #081a36;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #7dd3fc; }
    p { color: #cbd5e1; }
    .status {
      padding: 12px 20px;
      background: #14532d;
      border-radius: 25px;
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <h1>Welcome to Cloud LaunchPad!</h1>
  <p>My first website deployed on Amazon EC2</p>
  <div class="status">Apache Web Server Running</div>
  <p>Powered by AWS EC2 | Amazon Linux | Apache</p>
</body>
</html>
